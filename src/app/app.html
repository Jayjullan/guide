<mat-sidenav-container class="container">

  <!-- Sidebar -->
  <mat-sidenav mode="side" opened class="sidebar">

    <h2>{{ title }}</h2>

    <mat-nav-list>

      <!-- Home -->
      <a mat-list-item
         routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">

        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>Home</span>

      </a>

      <!-- Signal -->
      <a mat-list-item
         routerLink="/signal"
         routerLinkActive="active">

        <mat-icon matListItemIcon>bolt</mat-icon>
        <span matListItemTitle>Signal</span>

      </a>

      <!-- Forms -->
      <a mat-list-item
         routerLink="/forms"
         routerLinkActive="active">

        <mat-icon matListItemIcon>description</mat-icon>
        <span matListItemTitle>Forms</span>

      </a>

      <a mat-list-item
         routerLink="/drag-drop"
         routerLinkActive="active">

        <mat-icon matListItemIcon>open_with</mat-icon>
        <span matListItemTitle>Drag & Drop</span>

      </a>

      <a mat-list-item
         routerLink="/weather"
         routerLinkActive="active">

        <mat-icon matListItemIcon>cloud</mat-icon>
        <span matListItemTitle>Weather</span>

      </a>

      <a
        mat-list-item
        routerLink="/queries"
        routerLinkActive="active"
      >
        <mat-icon matListItemIcon>search</mat-icon>
        <span matListItemTitle>Queries</span>
      </a>

    </mat-nav-list>

  </mat-sidenav>

  <!-- Main Content -->
  <mat-sidenav-content>

    <mat-toolbar>
      <span>My Angular App</span>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
